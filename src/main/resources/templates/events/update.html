<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Update Event')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 class="fw-bold">Update Event <span th:text="${eventForm.name}"></span> for <span th:text="${club.name}"></span></h1>

    <form th:action="@{/clubs/{clubId}/events/{eventId}(clubId=${club.id}, eventId=${event.id})}"
          th:object="${eventForm}" method="post" class="mt-4">

        <input type="hidden" name="_method" value="PUT">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" type="text" th:field="*{name}">
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Date</label>
            <input class="form-control" type="date" th:field="*{date}">
            <div class="text-danger" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Type</label>
            <select class="form-select" th:field="*{type}">
                <option value="">Select one</option>
                <option th:each="t : ${T(pt.unl.fct.iadi.novaevents.model.Event.EventType).values()}" th:value="${t}" th:text="${t}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Location</label>
            <input class="form-control" type="text" th:field="*{location}">
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}" rows="4"></textarea>
        </div>

        <button class="btn btn-primary" type="submit">Save</button>
    </form>
</div>
</body>
</html>
