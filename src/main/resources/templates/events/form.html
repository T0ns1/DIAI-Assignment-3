<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${formTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 th:text="${formTitle}">Event Form</h1>
    <p><strong>Club:</strong> <span th:text="${club.name}"></span></p>

    <form th:action="@{${formAction}}" th:object="${eventForm}" method="post" class="mt-4">
        <input th:if="${httpMethod != null}" type="hidden" name="_method" th:value="${httpMethod}">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" type="text" th:field="*{name}">
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Date</label>
            <input class="form-control" type="date" th:field="*{date}">
            <div class="text-danger" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Type</label>
            <select class="form-select" th:field="*{type}">
                <option value="">Select one</option>
                <option th:each="t : ${eventTypes}" th:value="${t}" th:text="${t}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Location</label>
            <input class="form-control" type="text" th:field="*{location}">
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}" rows="4"></textarea>
        </div>

        <button class="btn btn-primary" type="submit" th:text="${submitLabel}">Save</button>
    </form>
</div>
</body>
</html>
