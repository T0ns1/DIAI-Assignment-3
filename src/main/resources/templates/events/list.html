<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<nav th:replace="~{fragments/layout :: head('Events')}"></nav>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 class="fw-bold mb-4">All Events</h1>

    <div class="card mb-4">
        <div class="card-header">Filter Events</div>
        <div class="card-body">
            <form th:action="@{events}" method="get">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label">Event Type</label>
                        <select name="type" class="form-select">
                            <option value="">All types</option>
                            <option th:each="t : ${eventTypes}"
                                    th:selected="${selectedType == t.name}"
                                    th:value="${t.name}" th:text="${t.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Club</label>
                        <select name="clubId" class="form-select">
                            <option value="">All clubs</option>
                            <option th:each="c : ${clubs}"
                                    th:selected="${selectedClubId == c.id}"
                                    th:value="${c.id}" th:text="${c.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Filter</button>
                    </div>
                    <div class="col-md-2">
                        <a th:href="@{/events}" class="btn btn-outline-secondary w-100">Clear</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <table class="table">
        <thead class = "table-dark">
        <tr>
            <th>Name</th>
            <th>Club</th>
            <th>Date</th>
            <th>Type</th>
            <th>Location</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td>
                <a th:href="@{/clubs/{clubId}/events/{eventId}(clubId=${event.club.id}, eventId=${event.id})}"
                   th:text="${event.name}">Event</a>
            </td>
            <td>
                <a th:href="@{/clubs/{id}(id=${event.club.id})}" th:text="${clubMap[event.club.id].name}">Club</a>
            </td>
            <td th:text="${#temporals.format(event.date, 'dd MMM yyyy')}"></td>
            <td><span class="badge bg-secondary" th:text="${event.type.name}"></span></td>
            <td th:text="${event.location} ?: '-'"></td>
            <td>
                <a class="btn btn-sm btn-outline-primary me-1"
                   th:href="@{/clubs/{clubId}/events/{eventId}/edit(clubId=${event.club.id}, eventId=${event.id})}">
                    Edit
                </a>
                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{/clubs/{clubId}/events/{eventId}/delete(clubId=${event.club.id}, eventId=${event.id})}">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
