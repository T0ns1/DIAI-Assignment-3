<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<nav th:replace="~{fragments/layout :: head('Delete Event')}"></nav>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 class="fw-bold">Delete Event</h1>
    <p>Are you sure you want to delete the following event?</p>

    <p><strong>Date</strong><br><span th:text="${#temporals.format(event.date, 'dd MMM yyyy')}"></span></p>
    <p><strong>Type</strong><br><span th:text="${event.type.name}"></span></p>
    <p><strong>Location</strong><br><span th:text="${event.location} ?: '-'"></span></p>
    <p><strong>Description</strong><br><span th:text="${event.description} ?: '-'"></span></p>
    <p><strong>Club</strong><br><a th:text="${club.name}"></a></p>

    <form method="post" th:action="@{/clubs/{clubId}/events/{eventId}(clubId=${club.id}, eventId=${event.id})}">
        <input type="hidden" name="_method" value="DELETE">
        <button class="btn btn-danger" type="submit">Yes, Delete</button>
    </form>
</div>
</body>
</html>
