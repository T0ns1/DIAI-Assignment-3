<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${event.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 th:text="${event.name}">Event</h1>

    <p><strong>Club:</strong> <a th:href="@{/clubs/{id}(id=${club.id})}" th:text="${club.name}">Club</a></p>
    <p><strong>Date:</strong> <span th:text="${event.date}"></span></p>
    <p><strong>Location:</strong> <span th:text="${event.location} ?: '-'"></span></p>
    <p><strong>Type:</strong> <span th:text="${event.type}"></span></p>
    <p><strong>Description:</strong> <span th:text="${event.description} ?: '-'"></span></p>

    <div class="mt-3">
        <a class="btn btn-secondary"
           th:href="@{/clubs/{clubId}/events/{eventId}/edit(clubId=${club.id}, eventId=${event.id})}">
            Edit
        </a>
        <a class="btn btn-danger"
           th:href="@{/clubs/{clubId}/events/{eventId}/delete(clubId=${club.id}, eventId=${event.id})}">
            Delete
        </a>
    </div>
</div>
</body>
</html>
