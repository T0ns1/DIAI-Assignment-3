<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<nav th:replace="~{fragments/layout :: head('New Event')}"></nav>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 th:text="${event.name}">Event</h1>

    <p><strong>Date</strong><br><span th:text="${#temporals.format(event.date, 'dd MMM yyyy')}"></span></p>
    <p><strong>Type</strong><br><span th:text="${event.type.name}"></span></p>
    <p><strong>Location</strong><br><span th:text="${event.location} ?: '-'"></span></p>
    <p><strong>Description</strong><br><span th:text="${event.description} ?: '-'"></span></p>
    <p><strong>Club</strong><br><a th:href="@{/clubs/{id}(id=${club.id})}" th:text="${club.name}"></a></p>

    <div class="mt-3">
        <a class="btn btn-primary"
           th:href="@{/clubs/{clubId}/events/{eventId}/edit(clubId=${club.id}, eventId=${event.id})}">
            Edit
        </a>
        <a class="btn btn-danger"
           th:href="@{/clubs/{clubId}/events/{eventId}/delete(clubId=${club.id}, eventId=${event.id})}">
            Delete
        </a>
    </div>
</div>
</body>
</html>
