<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${club.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 th:text="${club.name}">Club</h1>
        <a class="btn btn-primary" th:href="@{/clubs/{clubId}/events/new(clubId=${club.id})}">Create Event</a>
    </div>

    <p><strong>Category:</strong> <span th:text="${club.category}"></span></p>
    <p th:text="${club.description}"></p>

    <h2 class="mt-4">Events</h2>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Name</th>
            <th>Date</th>
            <th>Type</th>
            <th>Location</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td>
                <a th:href="@{/clubs/{clubId}/events/{eventId}(clubId=${club.id},eventId=${event.id})}"
                   th:text="${event.name}">Event</a>
            </td>
            <td th:text="${event.date}"></td>
            <td th:text="${event.type}"></td>
            <td th:text="${event.location} ?: '-'"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
